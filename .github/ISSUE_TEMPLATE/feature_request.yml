name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
type: feature

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide as much accurate information as possible.
        > Well-described feature requests are easier to evaluate and prioritize.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient evaluation for developers.
        - High-quality feature requests.
        - Consistent issue classification.
        - Long-term project maintenance and planning.

        The goal is to collect useful information without making feature requests unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        Providing recommended information may significantly improve evaluation and prioritization.

        🔧 Advanced fields are intended for experienced users, modpack authors, server administrators, and developers.

        If you do not understand what an advanced field means, **leave it empty**.

        Providing incorrect information is less helpful than leaving the field blank.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: |
        Describe the proposed feature and what it should do.
      placeholder: |
        I would like a feature that...
    validations:
      required: true
      min_length: 50

  - type: textarea
    id: usefulness
    attributes:
      label: Why Is This Useful?
      description: |
        Explain what problem this feature solves or what benefit it provides.
      placeholder: |
        This feature would be useful because...
    validations:
      required: true
      min_length: 30

  - type: textarea
    id: use_case
    attributes:
      label: Example Use Case ⚡
      description: |
        Describe a real-world gameplay situation where this feature would be useful.
      placeholder: |
        1. Player does ...
        2. Feature activates ...
        3. Desired result occurs

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type ⚡
      description: |
        Select the category that best matches the request.
      options:
        - Gameplay
        - Blocks
        - Items
        - GUI / UI
        - Visuals
        - World Generation
        - Configuration
        - Compatibility
        - Performance
        - API
        - Other

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots / Mockups ⚡
      description: |
        Upload mockups, references, diagrams, screenshots, or examples from other mods.

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions ⚡
      description: |
        Describe existing workarounds, alternatives, or reasons why they are insufficient.
      placeholder: |
        I currently use...
        Another possible solution would be...

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation 🔧
      description: |
        Explain how this feature could be implemented.
      placeholder: |
        Possible implementation:
        - Add ...
        - Modify ...
        - Create ...

  - type: textarea
    id: compatibility_notes
    attributes:
      label: Compatibility Considerations 🔧
      description: |
        Include information about compatibility with mods, APIs, data packs, resource packs, or loaders.

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧
      description: |
        Include technical information that may help evaluate the request.

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help explain the request.

        Examples:
        - Related mods
        - Related issues
        - Community demand
        - Additional context

  - type: markdown
    attributes:
      value: |
        ## Verification
        
        > [!WARNING]
        > This form is only for feature requests and improvement suggestions.
        >
        > **Bug reports, crashes, port requests, and translation issues should be submitted using their respective forms.**
        > 
        > Separate forms are provided to collect the information required for each issue type.
        > 
        > **Reports submitted using the wrong form may be closed without response.**
        >
        > Repeated misuse of issue forms may result in reports being removed.
        >
        > Please be respectful and considerate toward other community members, contributors, maintainers, and developers.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: |
        Please confirm the following before submitting.
      options:
        - label: I searched existing feature requests before creating this request.
          required: true

        - label: I clearly explained the intended use case.
          required: true

        - label: This request is not primarily a bug report.
          required: true