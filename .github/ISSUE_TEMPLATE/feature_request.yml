name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
type: feature

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide as much accurate information as possible.
        > Well-described feature requests are easier to evaluate and prioritize.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient evaluation for developers.
        - High-quality feature requests.
        - Consistent issue classification.
        - Long-term project maintenance and planning.

        The goal is to collect useful information without making feature requests unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        🔧 Advanced fields are intended for experienced users and developers.

        If you do not understand what an advanced field means, leave it empty.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: |
        Describe the feature you would like to see.
      placeholder: |
        I would like a feature that...
    validations:
      required: true
      min_length: 30

  - type: textarea
    id: usefulness
    attributes:
      label: Why Is This Useful?
      description: |
        Explain what problem this feature solves.
      placeholder: |
        This would be useful because...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: use_case
    attributes:
      label: Example Use Case ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe a real-world use case.
      placeholder: |
        1. Player does ...
        2. Feature activates ...
        3. Desired result occurs

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type ⚡
      options:
        - Gameplay
        - Blocks
        - Items
        - GUI / UI
        - Visuals
        - World Generation
        - Configuration
        - Compatibility
        - Performance
        - API
        - Other

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots / Mockups ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload mockups, references, diagrams, or examples.

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe existing workarounds or alternatives.

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation 🔧
      description: |
        Explain how this feature could be implemented.

  - type: textarea
    id: compatibility_notes
    attributes:
      label: Compatibility Considerations 🔧

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched existing feature requests before creating this request.
          required: true

        - label: I clearly explained the intended use case.
          required: true
