name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This form is only for feature requests.
        >
        > • Bugs → Use **Bug Report**
        > • Crashes → Use **Crash Report**
        > • Version support requests → Use **Port Request**
        > • Translation issues → Use **Translation Request**
        >
        > Feature requests are reviewed individually.
        > Submitting a request does not guarantee implementation.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Recommended fields are optional, but they may help us understand and evaluate your suggestion faster.

        Advanced fields are intended for experienced users and developers.
        If you do not understand what an advanced field means, **leave it empty**.

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: |
        Describe the feature you would like to see added.

        Explain the feature in detail and what it should do.
      placeholder: |
        I would like a feature that...
    validations:
      required: true

  - type: textarea
    id: usefulness
    attributes:
      label: Why is this useful?
      description: |
        Explain why this feature should be added.

        Describe the problem it solves or the benefit it provides.
      placeholder: |
        This feature would be useful because...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Example Use Case ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe a real-world gameplay situation where this feature would be useful.

        Examples help determine whether a feature is practical.
      placeholder: |
        Example:

        1. Player does ...
        2. Feature activates ...
        3. Desired result occurs

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots / Mockups ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload screenshots, concept art, mockups, diagrams, references, or examples from other mods.

        Visual references make it easier to understand your idea.

    validations:
      required: false

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type ⚡
      description: |
        **⚡ RECOMMENDED**

        Select the category that best matches your suggestion.
      options:
        - Gameplay
        - Blocks
        - Items
        - GUI / UI
        - Visuals
        - World Generation
        - Configuration
        - Compatibility
        - Performance
        - API
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe any existing workarounds or alternative solutions you have considered.

      placeholder: |
        I currently use...
        Another possible solution would be...

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation 🔧
      description: |
        **🔧 ADVANCED**

        Describe how this feature could be implemented.

        This section is intended for users with programming or modding experience.

        **If you are not familiar with software development, leave this field empty.**

      placeholder: |
        Possible implementation:
        - Add ...
        - Modify ...
        - Create ...

  - type: textarea
    id: compatibility_notes
    attributes:
      label: Compatibility Considerations 🔧
      description: |
        **🔧 ADVANCED**

        Include information about compatibility with:
        • Other mods
        • APIs
        • Data packs
        • Resource packs
        • Mod loaders

        **If you do not understand what this field means, leave it empty.**

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧
      description: |
        **🔧 ADVANCED**

        Include any technical information that may help evaluate the request.

        Examples:
        • Performance impact
        • Storage requirements
        • Network synchronization
        • Rendering considerations

        **If you do not understand what this field means, leave it empty.**

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help explain the request.

        Examples:
        • Related mods
        • Related issues
        • Additional context
        • Community demand