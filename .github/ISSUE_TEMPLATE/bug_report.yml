name: Bug Report
description: Report an issue that does not crash the game.
title: "[Bug]: "
labels:
  - bug
type: bug

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide as much accurate information as possible.
        >
        > Reports with sufficient information can be investigated significantly faster.
        >
        > The more details you provide, the easier it is to reproduce, diagnose, and resolve the issue.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient investigation for developers.
        - High-quality issue reports.
        - Consistent issue classification.
        - Long-term project maintenance and analysis.

        The goal is to collect useful information without making issue reporting unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        Providing recommended information may significantly reduce investigation and resolution time.

        🔧 Advanced fields are intended for experienced users, modpack authors, server administrators, and developers.

        If you do not understand what an advanced field means, **leave it empty**.

        Providing incorrect information is less helpful than leaving the field blank.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: textarea
    id: what_happened
    attributes:
      label: What Happened? *
      description: |
        Describe exactly what happened.

        Include:
        • What happened
        • When it happened
        • Why it appears incorrect

        Reports such as:
        • "Doesn't work"
        • "Broken"
        • "Fix this"

        usually do not provide enough information to investigate.
      placeholder: |
        What happened:
        The recipe book becomes empty after joining a world.

        When it happens:
        Every time after joining.

        Why it seems incorrect:
        Recipes should still be displayed.
      render: bash
    validations:
      required: true
      min_length: 100

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior *
      description: |
        Describe what should have happened instead.
      placeholder: |
        Recipes should remain visible after joining a world.
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce *
      description: |
        List the exact steps required to reproduce the issue.

        The easier it is to reproduce, the easier it is to investigate.
      placeholder: |
        1. Create or join a world
        2. Open the recipe book
        3. Change tabs
        4. Observe the issue
    validations:
      required: true
      min_length: 30

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: severity
    attributes:
      label: Severity *
      description: |
        How severe is the issue?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Area ⚡
      description: |
        **⚡ RECOMMENDED**
        Select the category that best matches the issue.
      options:
        - Gameplay
        - GUI
        - Rendering
        - Configuration
        - Localization
        - Compatibility
        - World Generation
        - Networking
        - Other

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility ⚡
      description: |
        **⚡ RECOMMENDED**
        How often does this issue occur?
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
        - Once

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: mod_version
    attributes:
      label: Mod Version *
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version *
      placeholder: 1.21.1
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader *
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: input
    id: mod_loader_version
    attributes:
      label: Mod Loader Version *
      placeholder: 0.xx.x
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java Version ⚡
      description: |
        **⚡ RECOMMENDED**
      placeholder: 21.0.7

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System ⚡
      description: |
        **⚡ RECOMMENDED**
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: dropdown
    id: environment
    attributes:
      label: Environment ⚡
      description: |
        **⚡ RECOMMENDED**
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots ⚡
      description: |
        **⚡ RECOMMENDED**
        Upload screenshots showing the issue.

        Screenshots are especially useful for:
        • GUI issues
        • Visual bugs
        • Rendering problems
        • Missing textures
        • Incorrect translations

  - type: upload
    id: latest_log
    attributes:
      label: Latest Log ⚡
      description: |
        **⚡ RECOMMENDED**
        Upload the latest.log file.

        Common location:
        .minecraft/logs/latest.log

  - type: textarea
    id: log_excerpt
    attributes:
      label: Relevant Log Excerpt ⚡
      description: |
        **⚡ RECOMMENDED**
        Paste the relevant log section if known.
      render: shell
      placeholder: |
        [Render thread/WARN] ...
        [Render thread/ERROR] ...

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: other_mods
    attributes:
      label: Other Installed Mods ⚡
      description: |
        **⚡ RECOMMENDED**
        List any mods that may interact with this mod.

        Mod conflicts are a common source of issues.
      placeholder: |
        Fabric API
        EMI
        Sodium

  - type: dropdown
    id: clean_environment_test
    attributes:
      label: Reproduces With Only This Mod Installed? ⚡
      description: |
        **⚡ RECOMMENDED**
        Testing without other mods can help identify compatibility issues.
      options:
        - "Yes"
        - "No"
        - Not Tested

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: jvm_arguments
    attributes:
      label: JVM Arguments 🔧
      description: |
        Provide custom JVM arguments if you are using any.

        Examples:
        • -Xmx8G
        • -Xms4G
        • Custom Java flags

        > [!IMPORTANT]
        > **🔧 ADVANCED**
        > If you do not know what JVM arguments are, leave this field empty.
      render: shell
      placeholder: |
        -Xmx8G
        -Xms4G

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help investigate the issue.

        Examples:
        • Video recordings
        • Temporary workarounds
        • Related issues
        • Unusual behavior not covered above

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification *
      description: |
        Please confirm the following before submitting.
      options:
        - label: I searched existing issues before creating this report.
          required: true

        - label: I tested the latest available version of the mod.
          required: true

        - label: I provided sufficient reproduction steps.
          required: true

        - label: I attached relevant logs, screenshots, or other evidence when available.
          required: true