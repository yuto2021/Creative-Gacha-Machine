name: Bug Report
description: Report an issue that does not crash the game.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This form is only for bug reports.
        >
        > • Game crashes → Use **Crash Report**
        > • New features → Use **Feature Request**
        > • Version support requests → Use **Port Request**
        > • Translation issues → Use **Translation Request**
        >
        > Issues submitted using the wrong template may be closed.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Recommended fields are optional, but providing them may help us investigate and resolve issues faster.

        Advanced fields are intended for experienced users and developers.
        If you do not understand what an advanced field means, **leave it empty**.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the issue in as much detail as possible.

        Explain what happened, where it happened, and any relevant circumstances.
      placeholder: |
        The issue occurs when...
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      description: |
        Enter the version of this mod where the issue occurred.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      description: |
        Enter the Minecraft version where the issue occurred.
      placeholder: 1.21.1
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader
      description: |
        Select the mod loader used when the issue occurred.
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: input
    id: mod_loader_version
    attributes:
      label: Mod Loader Version
      description: |
        Enter the version of the selected mod loader.
      placeholder: 0.xx.x
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: |
        List the exact steps required to reproduce the issue.

        The easier it is to reproduce, the easier it is to investigate.
      placeholder: |
        1. Open world
        2. Do something
        3. The issue occurs
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe what should have happened instead.

        This helps distinguish intended behavior from bugs.

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload screenshots showing the issue.

        Screenshots are especially useful for:
        • GUI issues
        • Visual bugs
        • Rendering problems
        • Missing textures
        • Incorrect translations

    validations:
      required: false

  - type: upload
    id: latest_log
    attributes:
      label: Latest Log ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload the latest.log file.

        The log may contain warnings and errors that help identify the cause of the issue.

        The log is usually located in:

        .minecraft/logs/latest.log

    validations:
      required: false

  - type: textarea
    id: other_mods
    attributes:
      label: Other Installed Mods ⚡
      description: |
        **⚡ RECOMMENDED**

        List any mods that may interact with this mod.

        Mod conflicts are a common source of issues.

      placeholder: |
        Fabric API
        JEI
        EMI

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: |
        Select where the issue occurred.
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      description: |
        Select the operating system used when the issue occurred.
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: textarea
    id: jvm_arguments
    attributes:
      label: JVM Arguments 🔧
      description: |
        **🔧 ADVANCED**

        Provide custom JVM arguments if you are using any.

        Examples:
        • -Xmx8G
        • -Xms4G
        • Custom Java flags

        This information is only useful for advanced troubleshooting.

        **If you do not know what JVM arguments are, leave this field empty.**

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help investigate the issue.

        Examples:
        • Video recordings
        • Temporary workarounds
        • Related issues
        • Unusual behavior not covered above