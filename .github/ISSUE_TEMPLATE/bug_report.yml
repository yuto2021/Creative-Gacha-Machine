name: Bug Report
description: Report an issue that does not crash the game.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Before Submitting

        ### Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Recommended fields are not required, but providing them may help us investigate and resolve issues faster.

        Advanced fields are intended for experienced users and developers.
        If you do not understand what an advanced field means, **leave it empty**.

        ### Checklist

        - Make sure you are using the latest version of the mod.
        - Check existing issues before creating a new one.
        - If the issue crashes the game, please use **Crash Report** instead.
        - Reports with insufficient information may be closed.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue in detail.
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      placeholder: 1.21.1
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader Version
      placeholder: 0.xx.x
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior ⚡
      description: |
        **⚡ RECOMMENDED**

        Describe what you expected to happen instead.

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots ⚡
      description: |
        **⚡ RECOMMENDED**

        Screenshots can help us understand visual issues, rendering problems, GUI glitches, and unexpected behavior.

  - type: textarea
    id: latest_log
    attributes:
      label: Latest Log ⚡
      description: |
        **⚡ RECOMMENDED**

        The latest.log file may contain warnings or errors that help identify the cause of the issue.

  - type: textarea
    id: other_mods
    attributes:
      label: Other Installed Mods ⚡
      description: |
        **⚡ RECOMMENDED**

        Mod conflicts are a common cause of issues. Please list any relevant installed mods.

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: textarea
    id: jvm_arguments
    attributes:
      label: JVM Arguments 🔧
      description: |
        **🔧 ADVANCED**

        Used for advanced troubleshooting and debugging.

        **If you do not know what JVM arguments are, leave this field empty.**

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information