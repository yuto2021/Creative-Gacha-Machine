name: Bug Report
description: Report an issue that does not crash the game.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Before Submitting

        * Required
        ⚡ Recommended
        🔧 Advanced

        - Make sure you are using the latest version of the mod.
        - Check existing issues before creating a new one.
        - If the issue crashes the game, please use **Crash Report** instead.
        - Reports with insufficient information may be closed.

  - type: textarea
    id: description
    priority: required
    attributes:
      label: Description
      description: Describe the issue in detail.
      placeholder: What happened?

  - type: input
    id: mod_version
    priority: required
    attributes:
      label: Mod Version
      placeholder: 1.0.0

  - type: input
    id: minecraft_version
    priority: required
    attributes:
      label: Minecraft Version
      placeholder: 1.21.1

  - type: dropdown
    id: loader
    priority: required
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt

  - type: input
    id: loader_version
    priority: required
    attributes:
      label: Loader Version
      placeholder: 0.xx.x

  - type: textarea
    id: reproduction_steps
    priority: required
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: expected_behavior
    priority: recommended
    attributes:
      label: Expected Behavior

  - type: textarea
    id: screenshots
    priority: recommended
    attributes:
      label: Screenshots

  - type: textarea
    id: latest_log
    priority: recommended
    attributes:
      label: Latest Log

  - type: textarea
    id: other_mods
    priority: recommended
    attributes:
      label: Other Installed Mods

  - type: dropdown
    id: environment
    priority: optional
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: dropdown
    id: operating_system
    priority: optional
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: textarea
    id: jvm_arguments
    priority: advanced
    attributes:
      label: JVM Arguments
      description: Only fill this field if you know what it means.

  - type: textarea
    id: additional_information
    priority: optional
    attributes:
      label: Additional Information