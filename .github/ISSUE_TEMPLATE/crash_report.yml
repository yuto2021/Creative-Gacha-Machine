name: Crash Report
description: Report a game crash.
title: "[Crash]: "
labels:
  - crash

body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This form is only for crash reports.
        >
        > • Non-crash issues → Use **Bug Report**
        > • New features → Use **Feature Request**
        > • Version support requests → Use **Port Request**
        > • Translation issues → Use **Translation Request**
        >
        > Reports submitted using the wrong template may be closed.
        >
        > Crash reports are often required to identify the cause of a crash.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Recommended fields are optional, but providing them may help us investigate and resolve issues faster.

        Advanced fields are intended for experienced users and developers.
        If you do not understand what an advanced field means, **leave it empty**.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe what happened before the crash occurred.

        Include any actions you performed immediately before the game crashed.
      placeholder: |
        The game crashed when...
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      description: |
        Enter the version of this mod where the crash occurred.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      description: |
        Enter the Minecraft version where the crash occurred.
      placeholder: 1.21.1
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader
      description: |
        Select the mod loader used when the crash occurred.
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: input
    id: mod_loader_version
    attributes:
      label: Mod Loader Version
      description: |
        Enter the version of the selected mod loader.
      placeholder: 0.xx.x
    validations:
      required: true

  - type: upload
    id: crash_report
    attributes:
      label: Crash Report
      description: |
        Upload the crash report generated by Minecraft.

        Crash reports contain important information that can help identify the cause of the crash.

        Common location:

        .minecraft/crash-reports/
    validations:
      required: true

  - type: upload
    id: latest_log
    attributes:
      label: Latest Log ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload the latest.log file.

        Additional information is often available in the log even when a crash report already exists.

        Common location:

        .minecraft/logs/latest.log

    validations:
      required: false

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce ⚡
      description: |
        **⚡ RECOMMENDED**

        List the exact steps required to reproduce the crash.

        Reproducible crashes are much easier to investigate.
      placeholder: |
        1. Open world
        2. Do something
        3. Game crashes

  - type: textarea
    id: other_mods
    attributes:
      label: Other Installed Mods ⚡
      description: |
        **⚡ RECOMMENDED**

        List any mods that may interact with this mod.

        Mod conflicts are a common cause of crashes.
      placeholder: |
        Fabric API
        JEI
        EMI

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload screenshots showing what happened before the crash.

        Screenshots may provide useful visual context.

    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: |
        Select where the crash occurred.
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      description: |
        Select the operating system used when the crash occurred.
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: textarea
    id: jvm_arguments
    attributes:
      label: JVM Arguments 🔧
      description: |
        **🔧 ADVANCED**

        Provide custom JVM arguments if you are using any.

        Examples:
        • -Xmx8G
        • -Xms4G
        • Custom Java flags

        This information is only useful for advanced troubleshooting.

        **If you do not know what JVM arguments are, leave this field empty.**

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help investigate the crash.

        Examples:
        • Temporary workarounds
        • Related crashes
        • Unusual behavior before the crash