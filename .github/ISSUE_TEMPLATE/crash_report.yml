name: Crash Report
description: Report a game crash.
title: "[Crash]: "
labels:
  - crash
type: bug

body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This form is only for crash reports.
        >
        > • Non-crash issues → Use **Bug Report**
        > • New features → Use **Feature Request**
        > • Version support requests → Use **Port Request**
        > • Translation issues → Use **Translation Request**
        >
        > Reports submitted using the wrong template may be closed.

        > [!IMPORTANT]
        > Please provide as much accurate information as possible.
        > Reports with sufficient information can be investigated significantly faster.
        > The more details you provide, the easier it is to reproduce, diagnose, and resolve the issue.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient investigation for developers.
        - High-quality issue reports.
        - Consistent issue classification.
        - Long-term project maintenance and analysis.

        The goal is to collect useful information without making issue reporting unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        Providing recommended information may significantly reduce investigation and resolution time.

        🔧 Advanced fields are intended for experienced users, modpack authors, server administrators, and developers.

        If you do not understand what an advanced field means, **leave it empty**.

        Providing incorrect information is less helpful than leaving the field blank.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: textarea
    id: what_happened
    attributes:
      label: What Happened?
      description: |
        Describe what happened before the crash.

        Avoid vague reports such as
        "Crashed", "Broken", or "Fix this".
      placeholder: |
        What happened:
        The game crashed while opening the configuration screen.

        When it happened:
        Every time after joining a world.

        What I was doing:
        Opening the mod settings menu.
    validations:
      required: true
      min_length: 50

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce ⚡
      description: |
        **⚡ RECOMMENDED**

        List the steps required to reproduce the crash.
      placeholder: |
        1. Join a world
        2. Open the settings screen
        3. Click the configuration button
        4. Observe the crash
    validations:
      min_length: 20

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: crash_category
    attributes:
      label: Crash Category
      options:
        - Startup
        - World Loading
        - World Join
        - Rendering
        - GUI
        - Networking
        - World Generation
        - Compatibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility ⚡
      description: |
        **⚡ RECOMMENDED**
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
        - Once

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      placeholder: 1.21.1
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: input
    id: mod_loader_version
    attributes:
      label: Mod Loader Version
      placeholder: 0.xx.x
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java Version ⚡
      description: |
        **⚡ RECOMMENDED**
      placeholder: 21.0.7

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System ⚡
      description: |
        **⚡ RECOMMENDED**
      options:
        - Windows
        - Linux
        - macOS
        - Other

  - type: dropdown
    id: environment
    attributes:
      label: Environment ⚡
      description: |
        **⚡ RECOMMENDED**
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated Server

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: crash_report
    attributes:
      label: Crash Report
      description: |
        Upload the generated crash report.

        Common location:
        .minecraft/crash-reports/
    validations:
      required: true
      accept:
        - ".txt"

  - type: upload
    id: latest_log
    attributes:
      label: Latest Log ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload the latest.log file.

        Common location:
        .minecraft/logs/latest.log
    validations:
      accept:
        - ".log"

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots ⚡
      description: |
        **⚡ RECOMMENDED**

        Upload screenshots showing what happened before the crash.
    validations:
      accept:
        - ".png"
        - ".jpg"
        - ".jpeg"
        - ".gif"
        - ".webp"

  - type: textarea
    id: crash_excerpt
    attributes:
      label: Relevant Crash Excerpt ⚡
      description: |
        **⚡ RECOMMENDED**

        Paste the relevant section if known.
      render: shell

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: other_mods
    attributes:
      label: Other Installed Mods ⚡
      description: |
        **⚡ RECOMMENDED**

        Mod conflicts are a common cause of crashes.
      placeholder: |
        Fabric API
        Sodium
        EMI

  - type: dropdown
    id: clean_environment_test
    attributes:
      label: Reproduces With Only This Mod Installed? ⚡
      description: |
        **⚡ RECOMMENDED**

        Testing without other mods may help identify compatibility problems.
      options:
        - "Yes"
        - "No"
        - "Not Tested"

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: jvm_arguments
    attributes:
      label: JVM Arguments 🔧
      description: |
        Examples:
        - -Xmx8G
        - -Xms4G
        - Custom Java flags

        > **🔧 ADVANCED**
        >
        > If you do not know what JVM arguments are, leave this field empty.
      render: shell
      placeholder: |
        -Xmx8G
        -Xms4G

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help investigate the crash.

        Examples:
        - Related crashes
        - Temporary workarounds
        - Additional observations

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: |
        Please confirm the following before submitting.
      options:
        - label: I searched existing issues before creating this report.
          required: true

        - label: I tested the latest available version of the mod.
          required: true

        - label: I attached a crash report.
          required: true

        - label: I attached relevant logs when available.
          required: true