name: Translation Request
description: Report missing, incorrect, or improved translations.
title: "[Translation]: "
labels:
  - translation
type: task

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide accurate translations whenever possible.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient review for translators and developers.
        - High-quality translation reports.
        - Consistent issue classification.
        - Long-term localization maintenance.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: dropdown
    id: languages
    attributes:
      label: Languages
      multiple: true
      options:
        - English (en_us)
        - Japanese (ja_jp)
        - German (de_de)
        - French (fr_fr)
        - Spanish (es_es)
        - Portuguese (pt_br)
        - Russian (ru_ru)
        - Chinese Simplified (zh_cn)
        - Chinese Traditional (zh_tw)
        - Korean (ko_kr)
        - Italian (it_it)
        - Polish (pl_pl)
        - Turkish (tr_tr)
        - Ukrainian (uk_ua)
        - Other
    validations:
      required: true

  - type: input
    id: other_language
    attributes:
      label: Other Language
      placeholder: tr_tr

  - type: textarea
    id: current_translation
    attributes:
      label: Current Translation
      placeholder: |
        Current text shown in-game...
    validations:
      required: true

  - type: textarea
    id: suggested_translation
    attributes:
      label: Suggested Translation
      placeholder: |
        Suggested translation...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: issue_type
    attributes:
      label: Translation Issue Type ⚡
      options:
        - Missing Translation
        - Incorrect Translation
        - Typo
        - Terminology
        - Formatting
        - Other

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: mod_version
    attributes:
      label: Mod Version ⚡
      placeholder: 1.0.0

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version ⚡
      placeholder: 1.21.1

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot ⚡

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: translation_context
    attributes:
      label: Translation Context 🔧
      placeholder: |
        item.example_mod.example_item
        gui.example_mod.menu.title

  - type: textarea
    id: terminology_notes
    attributes:
      label: Terminology Notes 🔧

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I verified the suggested translation before submitting.
          required: true