name: Translation Request
description: Report missing, incorrect, or improved translations.
title: "[Translation]: "
labels:
  - translation
type: task

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide accurate translations whenever possible.
        > Translation issues are easier to review and resolve when sufficient context is provided.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient review for translators and developers.
        - High-quality translation reports.
        - Consistent issue classification.
        - Long-term localization maintenance.

        The goal is to collect useful information without making translation reports unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        Providing recommended information may significantly improve review and resolution time.

        🔧 Advanced fields are intended for experienced translators, modpack authors, server administrators, and developers.

        If you do not understand what an advanced field means, **leave it empty**.

        Providing incorrect information is less helpful than leaving the field blank.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: dropdown
    id: languages
    attributes:
      label: Languages
      description: |
        Select the affected language.

        If the language is not listed, select "Other" and specify it below.
      options:
        - English (en_us)
        - Japanese (ja_jp)
        - German (de_de)
        - French (fr_fr)
        - Spanish (es_es)
        - Portuguese (pt_br)
        - Russian (ru_ru)
        - Chinese Simplified (zh_cn)
        - Chinese Traditional (zh_tw)
        - Korean (ko_kr)
        - Italian (it_it)
        - Polish (pl_pl)
        - Turkish (tr_tr)
        - Ukrainian (uk_ua)
        - Other
    validations:
      required: true

  - type: input
    id: other_language
    attributes:
      label: Other Language
      description: |
        Only fill this field if "Other" was selected above.
      placeholder: tr_tr

  - type: textarea
    id: current_translation
    attributes:
      label: Current Translation
      description: |
        Enter the text currently displayed in-game.

        Copy the text exactly as shown.
      placeholder: |
        Current text shown in-game...
    validations:
      required: true
      min_length: 2

  - type: textarea
    id: suggested_translation
    attributes:
      label: Suggested Translation
      description: |
        Enter the translation that should be used instead.
      placeholder: |
        Suggested translation...
    validations:
      required: true
      min_length: 2

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: issue_type
    attributes:
      label: Translation Issue Type ⚡
      description: |
        Select the category that best matches the issue.
      options:
        - Missing Translation
        - Incorrect Translation
        - Typo
        - Terminology
        - Formatting
        - Other

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: mod_version
    attributes:
      label: Mod Version ⚡
      placeholder: 1.0.0

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version ⚡
      placeholder: 1.21.1

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot ⚡
      description: |
        Upload a screenshot showing the translation issue.

        Screenshots help identify location and context.

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: translation_context
    attributes:
      label: Translation Context 🔧
      description: |
        Provide translation keys, file paths, or other technical information if known.
      placeholder: |
        item.example_mod.example_item
        gui.example_mod.menu.title

  - type: textarea
    id: terminology_notes
    attributes:
      label: Terminology Notes 🔧
      description: |
        Explain terminology choices, style guides, or translation conventions if relevant.

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: |
        Provide any additional information that may help resolve the translation issue.

        Examples:
        - Reference translations
        - Terminology references
        - Cultural context
        - Related translation issues

  - type: markdown
    attributes:
      value: |
        ## Verification
        
        > [!WARNING]
        > This form is only for translation and localization issues.
        >
        > **Bugs, crashes, feature requests, and port requests should be submitted using their respective forms.**
        > 
        > Separate forms are provided to collect the information required for each issue type.
        > 
        > **Reports submitted using the wrong form may be closed without response.**
        >
        > Repeated misuse of issue forms may result in reports being removed.
        >
        > Please be respectful and considerate toward other community members, contributors, maintainers, and developers.      

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: |
        Please confirm the following before submitting.
      options:
        - label: I verified the suggested translation before submitting.
          required: true

        - label: I copied the current translation exactly as displayed.
          required: true