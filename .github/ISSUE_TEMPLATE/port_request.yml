name: Port Request
description: Request support for another Minecraft version or mod loader.
title: "[Port]: "
labels:
  - port-request

body:
  - type: markdown
    attributes:
      value: |
        ## Before Submitting

        ### Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Recommended fields are not required, but providing them may help us evaluate the port request faster.

        Advanced fields are intended for experienced users and developers.
        If you do not understand what an advanced field means, **leave it empty**.

        ### Checklist

        - Check existing issues before creating a new one.
        - Verify that the requested version is not already planned.
        - Explain why this port would be useful.

  - type: input
    id: current_version
    attributes:
      label: Current Supported Version
      placeholder: 1.21.1
    validations:
      required: true

  - type: input
    id: requested_version
    attributes:
      label: Requested Version
      placeholder: 1.21.4
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason ⚡
      description: |
        **⚡ RECOMMENDED**

        Explain why support for this version or loader is needed.

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧
      description: |
        **🔧 ADVANCED**

        Include dependency, compatibility, API migration, or implementation information.

        **If you do not understand what this field means, leave it empty.**

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Any other information you would like to provide.