name: Port Request
description: Request support for another Minecraft version or mod loader.
title: "[Port]: "
labels:
  - port-request
type: task

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Port requests are evaluated based on demand, maintenance cost, and technical feasibility.
        >
        > Submitting a request does not guarantee that a port will be created.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient evaluation for developers.
        - High-quality port requests.
        - Consistent issue classification.
        - Long-term project planning.

        The goal is to collect useful information without making port requests unnecessarily difficult.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

        Please only fill in the information you know.

        ⚡ Recommended fields are optional, but strongly encouraged.

        Providing recommended information may significantly improve evaluation and prioritization.

        🔧 Advanced fields are intended for experienced users, modpack authors, server administrators, and developers.

        If you do not understand what an advanced field means, **leave it empty**.

        Providing incorrect information is less helpful than leaving the field blank.

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: input
    id: current_minecraft_version
    attributes:
      label: Current Minecraft Version
      description: |
        Enter the Minecraft version currently supported by the mod.
      placeholder: 1.21.1
    validations:
      required: true

  - type: input
    id: requested_minecraft_version
    attributes:
      label: Requested Minecraft Version
      description: |
        Enter the Minecraft version you would like to see supported.
      placeholder: 1.21.4
    validations:
      required: true

  - type: dropdown
    id: current_mod_loader
    attributes:
      label: Current Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: dropdown
    id: requested_mod_loader
    attributes:
      label: Requested Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: |
        Explain why support for this version or loader is needed.
      placeholder: |
        This port would be useful because...
    validations:
      required: true
      min_length: 30

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: request_type
    attributes:
      label: Request Type ⚡
      description: |
        Select the type of port being requested.
      options:
        - Version Port
        - Loader Port
        - Both

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: textarea
    id: use_case
    attributes:
      label: Use Case ⚡
      description: |
        Describe who would benefit from this port and how it would be used.
      placeholder: |
        Example:
        - Players using version ...
        - Modpacks targeting ...
        - Server owners running ...

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: references
    attributes:
      label: References ⚡
      description: |
        Upload changelogs, compatibility reports, screenshots, documents, or other supporting materials.

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: compatibility_notes
    attributes:
      label: Compatibility Notes ⚡
      description: |
        Include information about related mods, APIs, dependencies, modpacks, or ecosystem support.
      placeholder: |
        Related mods:
        API requirements:
        Known compatibility considerations:

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧
      description: |
        Include technical details that may help evaluate the port.

        Examples:
        - API changes
        - Loader differences
        - Removed features
        - Migration requirements

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes 🔧
      description: |
        Describe known implementation details, dependencies, or development challenges.

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that may help evaluate the request.

        Examples:
        - Community demand
        - Related projects
        - Existing forks
        - Development status

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: |
        Please confirm the following before submitting.
      options:
        - label: I searched existing port requests before creating this request.
          required: true

        - label: I verified that the requested version or loader is not already supported.
          required: true