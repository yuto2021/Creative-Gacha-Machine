name: Port Request
description: Request support for another Minecraft version or mod loader.
title: "[Port]: "
labels:
  - port-request
type: task

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Port requests are evaluated based on demand, maintenance cost, and technical feasibility.

        ## Goals

        This issue form is designed to balance:

        - Ease of reporting for users.
        - Efficient evaluation for developers.
        - High-quality port requests.
        - Consistent issue classification.
        - Long-term project planning.

        ## Legend

        * Required
        ⚡ Recommended
        🔧 Advanced

  - type: markdown
    attributes:
      value: |
        ## Information

  - type: input
    id: current_minecraft_version
    attributes:
      label: Current Minecraft Version
      placeholder: 1.21.1
    validations:
      required: true

  - type: input
    id: requested_minecraft_version
    attributes:
      label: Requested Minecraft Version
      placeholder: 1.21.4
    validations:
      required: true

  - type: dropdown
    id: current_mod_loader
    attributes:
      label: Current Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: dropdown
    id: requested_mod_loader
    attributes:
      label: Requested Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Classification

  - type: dropdown
    id: request_type
    attributes:
      label: Request Type ⚡
      options:
        - Version Port
        - Loader Port
        - Both

  - type: textarea
    id: reason
    attributes:
      label: Reason
      placeholder: |
        This port would be useful because...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: textarea
    id: use_case
    attributes:
      label: Use Case ⚡

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: upload
    id: references
    attributes:
      label: References ⚡

  - type: markdown
    attributes:
      value: |
        ## Compatibility

  - type: textarea
    id: compatibility_notes
    attributes:
      label: Compatibility Notes ⚡

  - type: markdown
    attributes:
      value: |
        ## Advanced Diagnostics

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes 🔧

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes 🔧

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information

  - type: markdown
    attributes:
      value: |
        ## Verification

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched existing port requests before creating this request.
          required: true